name: Visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    name: Generate Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-dev -o
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run wp-env:start
      - run: npx playwright test --project=visual --update-snapshots
        env:
          CI: 'true'
          KA11Y_VISUAL: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: visual-baselines-linux
          path: tests/e2e/__screenshots__/linux
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: npm run wp-env:stop
