name: Release

on:
  push:
    tags: ['v*']

permissions: {}

env:
  PLUGIN_SLUG: kotlinskidev-accessibility

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.1'
          tools: composer:v2, wp-cli
          coverage: none
      - run: npm ci
      - run: npm run build
      - run: composer install --no-dev -o --prefer-dist --no-interaction
      - run: node bin/check-version.mjs
      - run: |
          mkdir -p dist
          node bin/release-notes.mjs "${GITHUB_REF_NAME}" > dist/release-notes.md
      - run: |
          wp i18n make-pot . languages/${PLUGIN_SLUG}.pot --include=src/php,build --allow-root
          wp i18n make-json languages --no-purge --allow-root
          node bin/fix-i18n-json.mjs
      - run: |
          mkdir -p "dist/${PLUGIN_SLUG}"
          rsync -a --exclude-from=.distignore ./ "dist/${PLUGIN_SLUG}/" --exclude=dist
          (cd dist && zip -qr "${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}")
      - run: |
          listing=$(unzip -Z1 "dist/${PLUGIN_SLUG}.zip")
          for required in build/loader.js build/manifest.php build/launcher.css build/admin.js vendor/autoload.php kotlinskidev-accessibility.php; do
            if ! grep -qx "${PLUGIN_SLUG}/${required}" <<< "$listing"; then
              echo "Missing ${required} in zip" >&2
              exit 1
            fi
          done
      - run: |
          cd dist
          sha256sum "${PLUGIN_SLUG}.zip" > "${PLUGIN_SLUG}.zip.sha256"
          sha256sum --check "${PLUGIN_SLUG}.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: |
            dist/${{ env.PLUGIN_SLUG }}.zip
            dist/${{ env.PLUGIN_SLUG }}.zip.sha256
            dist/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/${{ env.PLUGIN_SLUG }}.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/${{ env.PLUGIN_SLUG }}.zip
            dist/${{ env.PLUGIN_SLUG }}.zip.sha256
          body_path: dist/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          for required in "${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}.zip.sha256"; do
            grep -qx "${required}" <<< "${assets}" || {
              echo "Release asset ${required} missing" >&2
              exit 1
            }
          done
