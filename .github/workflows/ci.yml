name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-guard:
    name: Front-end source is unchanged
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'frontend-change')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --exit-code "origin/${{ github.base_ref }}...HEAD" -- src/ts/frontend src/ts/shared src/ts/bootstrap src/ts/loader src/scss/widget src/scss/launcher src/scss/page

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpcs --standard=phpcs.xml.dist
      - run: composer test:unit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: composer-phpstan-
      - run: composer install --no-interaction --prefer-dist
      - run: composer run analyse

  js:
    name: Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check-budget
      - run: npm run check-version

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-dev -o
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run wp-env:start
      - id: scope
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && npx playwright test --list --grep @smoke 2>/dev/null | grep -Eq '^Total: [1-9]'; then
            echo "args=--grep @smoke" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - run: npx playwright test ${{ steps.scope.outputs.args }}
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: npm run wp-env:stop

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: kotlinskidev-accessibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - run: npm ci
      - run: npm run build
      - run: composer install --no-dev -o --prefer-dist --no-interaction
      - run: |
          mkdir -p "dist/${PLUGIN_SLUG}"
          rsync -a --exclude-from=.distignore ./ "dist/${PLUGIN_SLUG}/" --exclude=dist
      - uses: WordPress/plugin-check-action@v1.1.9
        with:
          build-dir: dist/${{ env.PLUGIN_SLUG }}
          slug: ${{ env.PLUGIN_SLUG }}
          exclude-checks: |
            plugin_updater
            plugin_readme
          ignore-codes: |
            wp_function_not_compatible_with_requires_wp
            missing_composer_json_file
            WordPress.DB.SlowDBQuery.slow_db_query_meta_query
            WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound
