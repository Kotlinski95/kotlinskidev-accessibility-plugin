name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: WP ${{ matrix.wp }} / PHP ${{ matrix.php }} / chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        wp: ['6.4', 'latest']
        php: ['8.1', '8.4']
        exclude:
          - wp: '6.4'
            php: '8.4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-dev -o
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - env:
          WP_VERSION: ${{ matrix.wp }}
          PHP_VERSION: ${{ matrix.php }}
        run: |
          core=null
          if [ "${WP_VERSION}" != "latest" ]; then
            core="\"WordPress/WordPress#${WP_VERSION}\""
          fi
          printf '{"core":%s,"phpVersion":"%s"}\n' "${core}" "${PHP_VERSION}" > .wp-env.override.json
          cat .wp-env.override.json
      - run: npm run wp-env:start
      - run: npx playwright test --project=chromium
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-wp${{ matrix.wp }}-php${{ matrix.php }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: npm run wp-env:stop

  cross-browser:
    name: ${{ matrix.browser }} smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-dev -o
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run wp-env:start
      - run: npx playwright test --project=${{ matrix.browser }} --grep @smoke
        env:
          CI: 'true'
          KA11Y_CROSS_BROWSER: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: npm run wp-env:stop
