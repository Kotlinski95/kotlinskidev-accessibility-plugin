name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: WP ${{ matrix.wp }} / PHP ${{ matrix.php }} / chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        wp: ['6.4', 'latest']
        php: ['8.1', '8.5']
        exclude:
          - wp: '6.4'
            php: '8.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-dev -o
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - env:
          WP_VERSION: ${{ matrix.wp }}
          PHP_VERSION: ${{ matrix.php }}
        run: |
          core=null
          if [ "${WP_VERSION}" != "latest" ]; then
            core="\"WordPress/WordPress#${WP_VERSION}\""
          fi
          printf '{"core":%s,"phpVersion":"%s"}\n' "${core}" "${PHP_VERSION}" > .wp-env.override.json
          cat .wp-env.override.json
      - run: npm run wp-env:start
      - run: npx playwright test --project=chromium
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-wp${{ matrix.wp }}-php${{ matrix.php }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: npm run wp-env:stop

  cross-browser:
    name: ${{ matrix.browser }} smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-dev -o
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run wp-env:start
      - run: npx playwright test --project=${{ matrix.browser }} --grep @smoke
        env:
          CI: 'true'
          KA11Y_CROSS_BROWSER: '1'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: npm run wp-env:stop

  lighthouse:
    name: Lighthouse widget on vs off
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-dev -o
      - run: npm ci
      - run: npm run build
      - run: npm run wp-env:start
      - name: Locate Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Widget off
        run: |
          npx wp-env run cli wp eval-file "wp-content/plugins/$(basename "$GITHUB_WORKSPACE")/bin/lh-widget.php" off
          for i in 1 2 3 4 5; do curl -s -o /dev/null http://localhost:8889/; done
          LHCI_OUTPUT_DIR=lh-results/off npx lhci autorun --config=lighthouserc.cjs
      - name: Widget on
        run: |
          npx wp-env run cli wp eval-file "wp-content/plugins/$(basename "$GITHUB_WORKSPACE")/bin/lh-widget.php" on
          for i in 1 2 3 4 5; do curl -s -o /dev/null http://localhost:8889/; done
          LHCI_OUTPUT_DIR=lh-results/on npx lhci autorun --config=lighthouserc.cjs
      - name: Widget on with saved state
        run: LHCI_OUTPUT_DIR=lh-results/saved LHCI_PUPPETEER_SCRIPT=bin/lh-seed-state.cjs npx lhci autorun --config=lighthouserc.cjs
      - run: node bin/lh-compare.mjs lh-results/off lh-results/on lh-results/saved
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lighthouse-results
          path: lh-results/
          retention-days: 7
      - if: always()
        run: npm run wp-env:stop

  upgrade:
    name: Upgrade from every release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-dev -o
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run wp-env:start
      - run: npx playwright test --project=upgrade
        env:
          CI: 'true'
          KA11Y_UPGRADE: '1'
          GH_TOKEN: ${{ github.token }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-upgrade
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: npm run wp-env:stop

  visual:
    name: Visual regression on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: baselines
        run: |
          if [ -n "$(find tests/e2e/__screenshots__/linux -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No committed Linux baselines, visual job skipped"
          fi
      - if: steps.baselines.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - if: steps.baselines.outputs.present == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - if: steps.baselines.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist --no-dev -o
      - if: steps.baselines.outputs.present == 'true'
        run: npm ci
      - if: steps.baselines.outputs.present == 'true'
        run: npm run build
      - if: steps.baselines.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.baselines.outputs.present == 'true'
        run: npm run wp-env:start
      - if: steps.baselines.outputs.present == 'true'
        run: npx playwright test --project=visual
        env:
          CI: 'true'
          KA11Y_VISUAL: '1'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always() && steps.baselines.outputs.present == 'true'
        run: npm run wp-env:stop
